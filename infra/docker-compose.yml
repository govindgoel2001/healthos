# Meteor Health — full stack on a single VPS.
# Phase 1 brings up postgres + agent. The bot and web services land in
# Phases 2-3; they are defined here but commented until those apps exist.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meteor
      POSTGRES_PASSWORD: meteor
      POSTGRES_DB: meteor
    volumes:
      - meteor-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meteor"]
      interval: 5s
      timeout: 5s
      retries: 10

  agent:
    build:
      context: ..
      dockerfile: infra/agent.Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://meteor:meteor@postgres:5432/meteor
      GARMIN_MCP_TRANSPORT: stdio
    volumes:
      # OAuth tokens written once by `garmin-mcp-auth` — see README.
      - meteor-garmin-tokens:/root/.garminconnect
    depends_on:
      postgres:
        condition: service_healthy

