# Meteor Health — full stack on a single VPS.
#
#   docker compose -f infra/docker-compose.yml up -d --build
#
# First run, after the containers are up:
#   docker compose -f infra/docker-compose.yml exec bot pnpm db:migrate
#   docker compose -f infra/docker-compose.yml exec bot \
#     uvx --python 3.12 --from git+https://github.com/Taxuspt/garmin_mcp garmin-mcp-auth
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meteor
      POSTGRES_PASSWORD: meteor
      POSTGRES_DB: meteor
    volumes:
      - meteor-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meteor"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Telegram bot + 06:30 morning job. Also the place to run db:migrate and
  # the reason / verify:mcp CLIs via `docker compose exec bot …`.
  bot:
    build:
      context: ..
      dockerfile: infra/bot.Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://meteor:meteor@postgres:5432/meteor
      GARMIN_MCP_TRANSPORT: stdio
    volumes:
      # OAuth tokens written once by `garmin-mcp-auth` — see README.
      - meteor-garmin-tokens:/root/.garminconnect
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://meteor:meteor@postgres:5432/meteor
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - meteor-caddy:/data
    depends_on:
      - web
    restart: unless-stopped

volumes:
  meteor-pgdata:
  meteor-garmin-tokens:
  meteor-caddy:
